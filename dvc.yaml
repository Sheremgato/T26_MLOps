stages:
  # Входной шлюз: полный набор проверяется контрактом из ЛР2.
  # При нарушении валидатор возвращает ненулевой код и dvc repro останавливается.
  validate:
    cmd: python -m housing_price.validate_data --data data/raw/housing.csv --contract data/contract.json --report reports/validation/raw.json
    deps:
      - data/raw/housing.csv
      - data/contract.json
      - src/housing_price/validate_data.py
    outs:
      - reports/validation/raw.json
